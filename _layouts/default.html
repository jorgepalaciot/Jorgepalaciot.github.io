<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "es" }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="logo"><a href="{{ '/' | relative_url }}">JP<span style="color:var(--ink-faint)">/eng</span></a></div>
    <ul class="navlinks">
      <li><a href="{{ '/' | relative_url }}#about"><span class="t-es">Sobre mí</span><span class="t-en">About</span></a></li>
      <li><a href="{{ '/' | relative_url }}#work"><span class="t-es">Casos</span><span class="t-en">Work</span></a></li>
      <li><a href="{{ '/' | relative_url }}#academic"><span class="t-es">Investigación</span><span class="t-en">Research</span></a></li>
      <li><a href="{{ '/' | relative_url }}#services"><span class="t-es">Servicios</span><span class="t-en">Services</span></a></li>
      <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
      <li><a href="{{ '/' | relative_url }}#contact"><span class="t-es">Contacto</span><span class="t-en">Contact</span></a></li>
    </ul>
    <div class="navctrl">
      <button class="ctrlbtn" id="langBtn" aria-label="Toggle language">ES/EN</button>
      <button class="ctrlbtn" id="themeBtn" aria-label="Toggle theme">☾/☀</button>
    </div>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer>
  <div class="wrap" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:12px;">
    <span>© <span id="curYear2">2025</span> Jorge Palacio · Lima, Perú</span>
    <span><span class="t-es">Última actualización</span><span class="t-en">Last updated</span>: <span id="lastUpdate"></span></span>
  </div>
</footer>

<script>
// ---- year ----
const y = new Date().getFullYear();
document.getElementById('curYear2').textContent = y;
document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString();

// ---- language ----
const savedLang = localStorage.getItem('lang');
if(savedLang){
  document.documentElement.lang = savedLang;
}else{
  const browserLang = (navigator.language || 'es').toLowerCase();
  document.documentElement.lang = browserLang.startsWith('en') ? 'en' : 'es';
}
document.getElementById('langBtn').addEventListener('click', () => {
  const next = document.documentElement.lang === 'es' ? 'en' : 'es';
  document.documentElement.lang = next;
  localStorage.setItem('lang', next);
});

// ---- theme ----
const savedTheme = localStorage.getItem('theme');
if(savedTheme){ document.documentElement.setAttribute('data-theme', savedTheme); }
document.getElementById('themeBtn').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});
</script>

</body>
</html>
