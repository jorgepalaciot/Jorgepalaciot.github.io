---
layout: default
---
<article class="post">
  <div class="wrap post-wrap">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">
      <span class="lang-es">← Volver al blog</span><span class="lang-en">← Back to blog</span>
    </a>

    <header class="post-header">
      <div class="post-date mono">{{ page.date | date: "%d %b %Y" }}</div>
      <h1>{{ page.title }}</h1>
      {% if page.description %}
      <p class="post-excerpt muted">{{ page.description }}</p>
      {% endif %}
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    <a class="back-link back-link--bottom" href="{{ '/blog/' | relative_url }}">
      <span class="lang-es">← Volver al blog</span><span class="lang-en">← Back to blog</span>
    </a>
  </div>
</article>
